<!DOCTYPE html>
<html class="dark scroll-smooth" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
    <title>Raise AI | Course Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    background: "#000000",
                    surface: "#080808",
                    "surface-card": "#0d0d0d",
                    "surface-card-hover": "#141414",
                    neon: "#a3fd00",
                    "neon-glow": "rgba(163, 253, 0, 0.4)",
                    urgency: "#ff2a40",
                },
                fontFamily: {
                    sans: ["Inter", "sans-serif"],
                    headline: ["Montserrat", "sans-serif"],
                }
            }
        }
    }
    </script>
    <style>
        body { background-color: #000; color: #fff; }
        .material-symbols-outlined { font-variation-settings: "FILL" 1; vertical-align: middle; }
        .course-card { transition: all 0.2s ease; border: 1px solid #222; background: #080808; }
        .course-card:hover { border-color: #a3fd00; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(163,253,0,0.1); }
    </style>
</head>
<body class="font-sans antialiased overflow-x-hidden min-h-screen flex flex-col">

    <!-- Header -->
    <header class="w-full z-40 bg-black/90 border-b border-[#1a1a1a] sticky top-0 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-4 md:px-8 py-4 flex justify-between items-center">
            <a href="/" class="flex items-center gap-2">
                <img src="/webinar/logo.png" alt="Raise AI Logo" class="h-8 md:h-10 object-contain brightness-110" />
            </a>
            <div class="flex items-center gap-4">
                <a href="#" class="text-sm font-semibold text-neutral-400 hover:text-white transition">My Profile</a>
                <div class="w-8 h-8 rounded-full bg-[#222] border border-[#333] flex items-center justify-center">
                    <span class="material-symbols-outlined text-sm">person</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl mx-auto w-full px-4 md:px-8 py-10">
        
        <!-- Welcome Section -->
        <div class="mb-10">
            <h1 class="text-3xl md:text-5xl font-headline font-black mb-3">Welcome to <span class="text-neon">Flow AI Mastery</span></h1>
            <p class="text-neutral-400 text-base md:text-lg max-w-2xl">Complete all 10 days of the program to master AI video creation from scratch using 100% free tools.</p>
            
            <div class="mt-6 bg-[#111] border border-[#222] rounded-xl p-4 flex items-center justify-between gap-4">
                <div class="flex-1">
                    <div class="flex justify-between text-xs font-bold mb-2">
                        <span class="text-white">Your Progress</span>
                        <span class="text-neon">0% (0/10 Days)</span>
                    </div>
                    <div class="w-full bg-[#222] h-2 rounded-full overflow-hidden">
                        <div class="bg-neon h-full rounded-full" style="width: 0%;"></div>
                    </div>
                </div>
                <a href="/course/day-1.html" class="bg-neon text-black px-4 py-2 rounded-lg font-bold text-sm hover:bg-[#b5ff1a] transition shrink-0">Start Day 1</a>
            </div>
        </div>

        <!-- Course Modules Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="modules-grid">
            <!-- Populated by JS -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-[#050505] border-t border-[#111] py-8 text-center mt-auto">
        <p class="text-neutral-500 text-xs">&copy; 2026 Raise AI. All rights reserved.</p>
    </footer>

    <script>
        const modules = [
            { day: 1, title: "Introduction to Editing in Flow", duration: "45 mins" },
            { day: 2, title: "Structuring Advanced Prompts", duration: "50 mins" },
            { day: 3, title: "Controlling Camera Angles", duration: "40 mins" },
            { day: 4, title: "Mastering Motion Physics", duration: "55 mins" },
            { day: 5, title: "Generating Consistent Characters", duration: "60 mins" },
            { day: 6, title: "Lip Syncing & Audio Fundamentals", duration: "45 mins" },
            { day: 7, title: "Advanced Visual Effects", duration: "50 mins" },
            { day: 8, title: "Upscaling and Enhancing Details", duration: "40 mins" },
            { day: 9, title: "Creating the Final Compilation", duration: "65 mins" },
            { day: 10, title: "Monetization & Client Delivery", duration: "45 mins" },
        ];

        const grid = document.getElementById("modules-grid");
        
        modules.forEach(m => {
            const card = document.createElement("a");
            card.href = "/course/day-" + m.day + ".html";
            card.className = "course-card rounded-2xl overflow-hidden block group";
            
            card.innerHTML = `
                <div class="aspect-video bg-[#1a1a1a] relative flex items-center justify-center border-b border-[#222]">
                    <span class="material-symbols-outlined text-4xl text-[#333] group-hover:text-neon transition">play_circle</span>
                    <div class="absolute bottom-2 right-2 bg-black/80 px-2 py-0.5 rounded text-[10px] font-bold text-white border border-[#333]">
                        ${m.duration}
                    </div>
                </div>
                <div class="p-5">
                    <div class="text-neon text-xs font-extrabold tracking-widest uppercase mb-1">Day ${m.day}</div>
                    <h3 class="text-lg font-bold text-white mb-2 leading-tight">${m.title}</h3>
                    <div class="flex items-center text-xs text-neutral-400 font-medium">
                        <span class="material-symbols-outlined text-[14px] mr-1">check_circle</span>
                        Not Started
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
